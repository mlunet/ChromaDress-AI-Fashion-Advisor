services:
  db:
    image: postgres:15-alpine
    container_name: chromadress-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chromadress
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chromadress-network

  redis:
    image: redis:alpine
    container_name: chromadress-redis
    ports:
      - "6379:6379"
    networks:
      - chromadress-network

  python-service:
    build: ./python
    container_name: chromadress-python
    ports:
      - "5000:5000"
    networks:
      - chromadress-network

  java-backend:
    build: ./java/ChromaDress
    container_name: chromadress-java
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chromadress
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ANALYSIS_SERVICE_URL: http://python-service:5000
      UPLOAD_DIR: /app/uploads/clothing/
      APP_BASE_URL: http://localhost:8080
    volumes:
      - ./uploads/clothing/:/app/uploads/clothing/
    depends_on:
      - db
      - redis
    networks:
      - chromadress-network

  angular-frontend:
    build: ./angular/ChromaDress
    container_name: chromadress-angular
    ports:
      - "80:80"
    depends_on:
      - java-backend
    networks:
      - chromadress-network

volumes:
  postgres_data:

networks:
  chromadress-network:
    driver: bridge