<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="max-w-md w-full space-y-8 p-10 bg-white rounded-xl shadow-lg border border-gray-100">

        <div class="text-center">
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
                ChromaDress
            </h2>
            <p class="mt-2 text-sm text-gray-600 font-medium" i18n="@@login.subtitle">
                Access your digital wardrobe
            </p>
        </div>

        <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="rounded-md -space-y-px">

                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1"
                        i18n="@@login.usernameLabel">Username</label>
                    <input id="username" type="text" formControlName="username" required
                        class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                        placeholder="Your username" i18n-placeholder="@@login.usernamePlaceholder">
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1"
                        i18n="@@login.passwordLabel">Password</label>
                    <input id="password" type="password" formControlName="password" required
                        class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                        placeholder="••••••••">
                </div>
            </div>

            @if (errorMessage) {
            <div class="bg-red-50 border-l-4 border-red-400 p-4 animate-pulse">
                <div class="flex">
                    <div class="text-sm text-red-700">
                        {{ errorMessage }}
                    </div>
                </div>
            </div>
            }

            <div>
                <button type="submit" [disabled]="loginForm.invalid"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                    i18n="@@login.submitButton">
                    Log In
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="text-sm text-gray-600">
                <span i18n="@@login.noAccount">Don't have an account?</span>
                <a routerLink="/auth/register"
                    class="font-medium text-indigo-600 hover:text-indigo-500 hover:cursor-pointer"
                    i18n="@@login.registerLink">
                    Register now
                </a>
            </p>
        </div>
    </div>
</div>
