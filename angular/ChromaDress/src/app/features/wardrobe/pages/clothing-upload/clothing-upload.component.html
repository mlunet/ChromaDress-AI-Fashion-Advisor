<div class="space-y-6">
    <div class="text-center">
        <h2 class="text-2xl font-bold text-gray-900">Nuovo Capo</h2>
        <p class="text-sm text-gray-500">Aggiungi un vestito al tuo armadio digitale</p>
    </div>

    <form [formGroup]="uploadForm" (ngSubmit)="onUpload()" class="space-y-5">
        <div class="rounded-md -space-y-px">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome
                    Capo</label>
                <input id="name" type="text" formControlName="name" required
                    class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                    placeholder="Es: Camicia di lino">
            </div>

            <div class="mb-4">
                <label for="category"
                    class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                <select id="category" formControlName="category" required
                    class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm cursor-pointer">
                    <option value="" disabled selected>Seleziona categoria</option>
                    <option value="TOPS">Sopra (T-shirt, Camicie)</option>
                    <option value="BOTTOMS">Sotto (Pantaloni, Gonne)</option>
                    <option value="OUTERWEAR">Giacche</option>
                    <option value="SHOES">Scarpe</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Foto</label>

                <label for="file-upload"
                    class="mt-1 flex flex-col items-center justify-center px-6 py-10 border-2 border-gray-300 border-dashed rounded-2xl hover:border-indigo-400 hover:bg-indigo-50/30 transition-all cursor-pointer group">

                    <input id="file-upload" type="file" class="sr-only"
                        (change)="onFileSelected($event)" accept="image/*">

                    <div class="space-y-2 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400 group-hover:text-indigo-500 transition-colors"
                            stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path
                                d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 005.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <div class="text-sm text-gray-600">
                            <span
                                class="font-semibold text-indigo-600 group-hover:text-indigo-700">Carica
                                un file</span>
                            <p class="text-xs text-gray-500 mt-1">PNG, JPG fino a 10MB</p>
                        </div>

                        @if (selectedFile) {
                        <div
                            class="mt-4 p-2 bg-green-50 rounded-lg border border-green-100 animate-in fade-in zoom-in duration-200">
                            <p
                                class="text-xs text-green-700 font-bold flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                        clip-rule="evenodd" />
                                </svg>
                                {{ selectedFile.name }}
                            </p>
                        </div>
                        }
                    </div>
                </label>
            </div>
        </div>

        <div>
            <button type="submit" [disabled]="uploadForm.invalid || !selectedFile"
                class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                Analizza e Salva
            </button>
        </div>
    </form>
</div>
