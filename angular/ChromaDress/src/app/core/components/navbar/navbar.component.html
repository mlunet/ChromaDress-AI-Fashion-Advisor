<nav class="bg-white shadow-md border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">

            <div class="flex items-center">
                <a routerLink="/wardrobe"
                    class="text-xl font-bold text-indigo-600 flex items-center">
                    ChromaDress
                </a>

                @if (authService.isAuthenticated()) {
                <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                    <a routerLink="/wardrobe" routerLinkActive="border-indigo-500 text-gray-900"
                        class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
                        i18n="@@nav.myWardrobe">
                        My Wardrobe
                    </a>
                </div>
                }
            </div>

            <div class="flex items-center space-x-4">
                <div class="flex items-center pr-2 border-r border-gray-200 mr-2">
                    <select (change)="switchLang($any($event.target).value)"
                        class="bg-transparent text-sm text-gray-500 focus:outline-none cursor-pointer hover:text-indigo-600">
                        <option value="en-US" [selected]="currentLang === 'en-US'">EN</option>
                        <option value="it" [selected]="currentLang === 'it'">IT</option>
                    </select>
                </div>

                @if (!authService.isAuthenticated()) {
                <a routerLink="/auth/login"
                    class="text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium"
                    i18n="@@nav.login">
                    Login
                </a>
                <a routerLink="/auth/register"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors"
                    i18n="@@nav.register">
                    Register
                </a>
                } @else {
                <span class="text-sm text-gray-500 hidden md:block italic" i18n="@@nav.welcomeBack">
                    Welcome back!
                </span>
                <button (click)="onLogout()"
                    class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-50 hover:text-red-600 transition-all cursor-pointer"
                    i18n="@@nav.logout">
                    Logout
                </button>
                }
            </div>

        </div>
    </div>
</nav>
