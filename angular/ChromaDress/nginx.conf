server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://java-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        if ($http_accept_language ~* "^it") {
            return 301 /it/;
        }
        return 301 /en-US/;
    }

    location /it/ {
        alias /usr/share/nginx/html/it/;
        try_files $uri $uri/ /it/index.html;
    }

    location /en-US/ {
        alias /usr/share/nginx/html/en-US/;
        try_files $uri $uri/ /en-US/index.html;
    }
}